name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean build cache
        id: lean-build-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          # A new namespace excludes caches saved before the custom build ran.
          key: lake-order32-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-order32-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Audit Order32 trust boundary
        run: python Scripts/audit_order32_trust.py
      - name: Check generated Order32 certificates
        run: python Scripts/generate_order32_cohomology.py --from-json --check-lean
      # Lake 5 intentionally schedules independent jobs concurrently and has no
      # job-count option. Keep every kernel decision isolated, and submit only
      # decision-free certificate modules in small topological batches.
      - name: Build Order32 certificates with bounded batching
        run: python Scripts/build_order32_serial.py --timings-json .lake/order32-build-timings.json
      - name: Upload Order32 build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order32-build-timings
          path: .lake/order32-build-timings.json
      - name: Build project
        run: lake build
      # Save only after both builds succeed and before the documentation step
      # changes the Lake target. Mathlib's own cache remains enabled in lean-action.
      - name: Save Lean build cache
        if: success() && steps.lean-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: ${{ steps.lean-build-cache.outputs.cache-primary-key }}
      - name: Select the reduced documentation target
        run: |
          python Scripts/generate_doc_entrypoint.py --check
          python Scripts/generate_doc_entrypoint.py --select-doc-target
      - uses: leanprover-community/docgen-action@v1
        env:
          DISABLE_EQUATIONS: 1
