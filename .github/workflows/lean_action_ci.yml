name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
      # Lake 5 intentionally schedules independent jobs concurrently and has no
      # job-count option. Keep the high-memory forest and PC-map checks isolated,
      # and submit the remaining certificates in small topological batches.
      - name: Build Order32 certificates with bounded batching
        run: python Scripts/build_order32_serial.py --timings-json .lake/order32-build-timings.json
      - name: Upload Order32 build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order32-build-timings
          path: .lake/order32-build-timings.json
      - name: Build project
        run: lake build
      - name: Select the reduced documentation target
        run: |
          python Scripts/generate_doc_entrypoint.py --check
          python Scripts/generate_doc_entrypoint.py --select-doc-target
      - uses: leanprover-community/docgen-action@v1
        env:
          DISABLE_EQUATIONS: 1
